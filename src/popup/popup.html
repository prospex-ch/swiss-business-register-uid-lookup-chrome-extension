<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="appShortName">Swiss UID Lookup</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="head">
      <img src="../../icons/icon-32.png" width="20" height="20" alt="">
      <h1 data-i18n="popupTitle">Swiss commercial register</h1>
    </header>
    <form id="search-form" role="search" autocomplete="off">
      <input id="q" type="search" data-i18n-placeholder="searchPlaceholder" aria-describedby="hint" autofocus spellcheck="false">
    </form>
    <p id="hint" class="hint" data-i18n="searchHint"></p>
    <section id="result" aria-live="polite"></section>
    <footer class="foot">
      <label class="toggle">
        <input id="highlight" type="checkbox">
        <span data-i18n="highlightToggle"></span>
      </label>
      <a id="home" target="_blank" rel="noopener" data-i18n="footerBrand"></a>
    </footer>
  </main>
  <script src="../lib/uid.js"></script>
  <script src="../data/legal-forms.js"></script>
  <script src="../lib/prospex.js"></script>
  <script src="../lib/card.js"></script>
  <script src="popup.js"></script>
</body>
</html>
